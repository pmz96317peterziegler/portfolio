description: >-
  - Helping a professor scale a non-majors circuits course from ∼40 to ∼175
  students by co-developing a library of 13

  hands-on demo videos that connect circuit theory to real-world electronics.

  - Built demonstrations spanning appliance and motor teardowns (identifying
  transformers, capacitors, and

  armature/stator components), RL/RC low-pass filters with phase-difference
  measurement, and a modeling of computer memory using digital logic.

  - Independently created a class A/B audio amplifier PCB, and produced a full
  KiCAD PCB design-and-fabrication walkthrough.
