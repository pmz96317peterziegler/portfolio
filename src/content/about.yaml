bio: >-
  The thing I keep chasing is the **gap between an idea and a working version of
  it**. I'm a Mechanical Engineering student at the **University of Georgia**,
  and what I enjoy most is taking a complex system and finding the math that
  describes it, whether that's the forces on someone's spine during a lift, the
  motion of a person's joints through a stride, or the kinematics of a robotic
  arm. I like that the modeling isn't the end of it. A model is only convincing
  once it survives contact with reality.


  That's the part I care about: not letting any of it stay abstract. At some
  point the code has to run, the math models reality correctly, and the part has
  to come off the **3D printing bed** or weld up straight, and that step is
  where I do most of my learning. I'm just as interested in **deriving the
  equations** as I am in **building the physical piece**, and I like robotics
  specifically because it forces both at once. Outside of engineering I love
  powerlifting and volunteering at the Brooklyn Cemetery restoration project in
  Athens.
